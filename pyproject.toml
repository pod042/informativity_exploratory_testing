[project]
name = "qspice-analysis-template"
version = "0.1.0"
description = "Template for simulation automation with qspice from Nunobrun."
authors = [
    {name = "pod042",email = "rafael.scholtz@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "qspice (>=1.1.1,<2.0.0)",
    "ipykernel (>=7.2.0,<8.0.0)",
    "pandas (>=3.0.1,<4.0.0)",
    "plotly (>=6.9.0,<7.0.0)",
    "handcalcs (>=1.11.0,<2.0.0)",
    "forallpeople (>=2.7.1,<3.0.0)",
    "nbformat (>=5.10.4,<6.0.0)",
    "cvxpy (>=1.9.2,<2.0.0)",
    "control (>=0.10.2,<0.11.0)",
    "jupyter-console (>=6.6.3,<7.0.0)",
    "mosek (>=11.2.2,<12.0.0)"
]

[tool.poetry]
packages = [{include = "qspice_utils", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.8,<0.16.0)"
]
